# =============================================
# AEGIS EMERGENCY RESPONSE SYSTEM
# Eureka Service Discovery Server Configuration
# =============================================

# Server Port - Eureka always runs on 8761 by convention
server.port=2026

# Application Name
spring.application.name=eureka-server

# =============================================
# EUREKA SERVER SETTINGS
# =============================================

# Do NOT register this server with itself (it IS the registry)
eureka.client.register-with-eureka=false

# Do NOT fetch registry from itself
eureka.client.fetch-registry=false

# Eureka server URL (self-reference for configuration)
eureka.client.service-url.defaultZone=http://localhost:2026/eureka/

# =============================================
# EUREKA INSTANCE SETTINGS
# =============================================

# Hostname for this Eureka server
eureka.instance.hostname=localhost

# How often clients should send heartbeats (in seconds)
eureka.server.eviction-interval-timer-in-ms=5000

# Wait time before removing unavailable instances (in seconds)
eureka.instance.lease-expiration-duration-in-seconds=30

# How often to send heartbeat
eureka.instance.lease-renewal-interval-in-seconds=10

# =============================================
# ACTUATOR - Health Monitoring
# =============================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# =============================================
# LOGGING
# =============================================
logging.level.com.netflix.eureka=OFF
logging.level.com.netflix.discovery=OFF
logging.level.root=INFO
