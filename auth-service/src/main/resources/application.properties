# =============================================
# AEGIS EMERGENCY RESPONSE SYSTEM
# Auth Service Configuration
# =============================================

# Server Port
server.port=8085

# Application Name (shown in Eureka Dashboard)
spring.application.name=auth-service

# Allow Circular References (Needed for Spring Security 6)
spring.main.allow-circular-references=true

# =============================================
# DATABASE - H2 In-Memory (No installation needed)
# =============================================
spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Web Console (access at http://localhost:8085/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# =============================================
# DATABASE - MySQL (Uncomment to use MySQL instead)
# =============================================
# spring.datasource.url=jdbc:mysql://localhost:3306/aegis_auth?createDatabaseIfNotExist=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=your_mysql_password
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =============================================
# JPA / HIBERNATE
# =============================================

# Auto create/update tables on startup
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in logs (set to false in production)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# JWT CONFIGURATION
# =============================================

# Secret key (Base64 encoded) - used to sign and verify JWT tokens
# This is a 256-bit key for HS256 algorithm
jwt.secret=YWVnaXNlbWVyZ2VuY3lyZXNwb25zZXN5c3RlbXNlY3JldGtleWZvcmp3dHRva2VuMjAyNg==

# Token expiry time in milliseconds (86400000 = 24 hours)
jwt.expiration=86400000

# =============================================
# EUREKA CLIENT - Register with Eureka Server
# =============================================
eureka.client.service-url.defaultZone=http://localhost:2026/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# =============================================
# ACTUATOR
# =============================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =============================================
# LOGGING
# =============================================
logging.level.com.aegis=DEBUG
logging.level.org.springframework.security=INFO
